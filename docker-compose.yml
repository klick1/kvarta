services:
  redis:
    image: redis:7-alpine
    container_name: kvarta_redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build: 
      context: ./backend
    container_name: kvarta_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/kvarta.db
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${8352758947:AAF5ClSlfLG3qggIBIwUq9x8P4AbnXyoIWs}
      - TELEGRAM_CHAT_ID=${818701560}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    container_name: kvarta_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Внутри docker-сети фронтенд стучится к бэкенду по имени сервиса
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000 # Для браузера пользователя
    depends_on:
      backend:
        condition: service_healthy